<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Churn Preventer</title>
    <meta name="description" content="Find what makes shoppers leave checkout, rank it by revenue at risk, and re-scan past sessions with new rules." />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect width=%2728%27 height=%2728%27 rx=%277%27 fill=%27%23111827%27/%3E%3Cpath d=%27M6.5 10 11 15.5l3-3 7.5 7%27 fill=%27none%27 stroke=%27%23ffffff%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Ccircle cx=%2711%27 cy=%2715.5%27 r=%272.2%27 fill=%27%23ef4444%27/%3E%3C/svg%3E" />
    <script>
      // Theme before first paint (no flash): the viewer's choice from src/theme.tsx; light unless they chose otherwise.
      (function () {
        var pref = null;
        try { pref = localStorage.getItem('cp-theme'); } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
